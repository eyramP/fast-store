[project]
name = "user-service"
version = "0.1.0"
description = "User service"
readme = "README.md"
authors = [
    { name = "Eyram Cobblah", email = "ecobblah2@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.142.2",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-grpc>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "passlib[bcrypt,bycrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath=[".]